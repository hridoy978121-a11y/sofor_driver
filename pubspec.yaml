name: sofor_driver
description: SOFOR Driver - 64 Zila
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.6
  firebase_auth: ^5.5.2
  shared_preferences: ^2.5.3
  confetti: ^0.8.0
  geocoding: ^2.0.0
  flutter_launcher_icons: ^0.14.4
  pinput: ^3.0.1
  sms_autofill: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png
    - assets/images/bottom_vehicles.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/logo.png"
    background_color: "#ffffff"
    theme_color: "#0a5c36"